spring.application.name=captcha-sample-app
server.port=8080

# Clave HMAC desde el entorno (Secret de Kubernetes en despliegue). Nunca en el repositorio.
security.altcha.hmac-key=${ALTCHA_HMAC_KEY}
security.altcha.protected-paths=POST /api/auth/login,POST /api/public/consulta

# Redis del proyecto (la librería reutiliza esta conexión).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
