# E2E: vigencia corta para probar la expiración y el reintento automático.
security.altcha.challenge-ttl=10s
security.altcha.base-cost=1000
# Solo E2E: cada prueba simula su IP con X-Forwarded-For para que los bloqueos no se crucen.
server.forward-headers-strategy=framework
security.altcha.challenge-rate-limit=1000
